<div class="project-card">
  <h4>{{ title }}</h4>
  <p>{{ description }}</p>
  @if (routerLink) {
    <a [routerLink]="routerLink" class="project-link">
      Ver mais detalhes →
    </a>
  }
  <ul class="tech-stack">
    @for (tech of techStack; track tech) {
      <li>{{ tech }}</li>
    }
  </ul>
</div>
