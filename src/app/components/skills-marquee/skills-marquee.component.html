<div class="skills-section">
    <h3>Skills</h3>
    <div class="marquee-wrapper">
        <div class="marquee">
            <div *ngFor="let skill of skills" class="skill-tag" [ngStyle]="{ '--skill-color': skill.color }">
                <img [ngSrc]="skill.icon" [alt]="skill.label" width="24" height="24" loading="lazy" />
                <span>{{ skill.label }}</span>
            </div>

            <!-- repetir para efeito contínuo -->
            <div *ngFor="let skill of skills" class="skill-tag" [ngStyle]="{ '--skill-color': skill.color }">
                <img [ngSrc]="skill.icon" [alt]="skill.label" width="24" height="24" loading="lazy" />
                <span>{{ skill.label }}</span>
            </div>
        </div>
    </div>
</div>
