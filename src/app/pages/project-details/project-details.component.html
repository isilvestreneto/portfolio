<section class="project-details">
  <h2>{{ title }}</h2>

  <div class="section-block">
    <h3> <svg lucideIcon="file-text" class="icon"></svg>
  Contexto</h3>
  <p>{{ context }}</p>
</div>

<div class="section-block">
  <h3> <svg lucideIcon="wrench" class="icon"></svg>
Atuação</h3>
<p>{{ contribution }}</p>
</div>

<div class="section-block">
  <h3> <svg lucideIcon="trending-up" class="icon"></svg>
Resultados</h3>
<p>{{ results }}</p>
</div>

<div class="section-block">
  <h3> <svg lucideIcon="cpu" class="icon"></svg>
Tecnologias</h3>
<div class="tech-tags">
  @for (tech of techStack; track tech; let i = $index) {
    <span class="tech-pill" [style.animation-delay.ms]="i * 100">
      #{{ tech }}
    </span>
  }
</div>
</div>
</section>
