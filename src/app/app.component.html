<button class="theme-toggle" (click)="themeService.toggleTheme()" [attr.aria-label]="'Trocar tema'">
    <span class="icon" [class.dark]="themeService.getTheme() === 'dark'">🌞</span>
    <span class="icon" [class.dark]="themeService.getTheme() === 'dark'">🌜</span>
    <span class="slider"></span>
</button>
<main [@routeAnimations]="prepareRoute(outlet)">
    <router-outlet #outlet="outlet"></router-outlet>
</main>
